[project]
name = "intelnexus-platform"
version = "1.0.0"
description = "Neutral integration and intelligence fusion hub for external API providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
explicit_package_bases = true
mypy_path = "backend"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
