name: Security Audit & Test CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-audit:
    name: Backend SAST, Typecheck & Pytest (≥ 85% Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy bandit pip-audit pytest pytest-cov pytest-asyncio

      - name: 1.1 Run Ruff linter
        run: ruff check backend/app backend/tests

      - name: 1.2 Check formatting with Ruff
        run: ruff format --check backend/app backend/tests

      - name: 1.3 Validate types with Mypy
        run: mypy backend/app

      - name: 1.4 Bandit SAST security scan
        run: bandit -r backend/app -ll -ii

      - name: 1.5 Dependency vulnerability scan with pip-audit
        run: pip-audit

      - name: 1.6 Run Pytest test suite with coverage requirement (≥ 85%)
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-fail-under=85

  frontend-audit:
    name: Frontend Lint & TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: 2.1 Run ESLint
        run: npm --prefix frontend run lint

      - name: 2.2 Validate TypeScript types
        run: npm --prefix frontend run type-check
