<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 92" width="460" height="92">
  <defs>
    <!-- Background Gradient for Emblem -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyan to Sky Gradient for Brand Text & Nodes -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Bright Electric Glow Gradient -->
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON (LEFT) ================= -->
  <g transform="translate(10, 10)">
    <!-- Emblem Container Badge -->
    <rect width="72" height="72" rx="18" fill="url(#emblemBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="70" height="70" x="1" y="1" rx="17" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Radar / Reticle Rings -->
    <circle cx="36" cy="36" r="26" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3.5" opacity="0.45"/>
    <circle cx="36" cy="36" r="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="36" cy="36" r="6" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.7"/>

    <!-- Reticle Crosshair Ticks -->
    <line x1="36" y1="5" x2="36" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="60" x2="36" y2="67" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="36" x2="12" y2="36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="36" x2="67" y2="36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Diagonal Targeting Brackets -->
    <path d="M 18 18 L 14 18 L 14 22" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 54 18 L 58 18 L 58 22" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 18 54 L 14 54 L 14 50" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 54 54 L 58 54 L 58 50" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Hexagonal Outer Graph Circuit -->
    <polygon points="36,16 52,26 52,46 36,56 20,46 20,26" fill="none" stroke="#0369a1" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.75"/>

    <!-- Network Graph Vectors from Center Nexus -->
    <line x1="36" y1="36" x2="36" y2="16" stroke="url(#cyanGrad)" stroke-width="1.8"/>
    <line x1="36" y1="36" x2="52" y2="26" stroke="url(#cyanGrad)" stroke-width="1.8"/>
    <line x1="36" y1="36" x2="52" y2="46" stroke="url(#cyanGrad)" stroke-width="1.8"/>
    <line x1="36" y1="36" x2="36" y2="56" stroke="url(#cyanGrad)" stroke-width="1.8"/>
    <line x1="36" y1="36" x2="20" y2="46" stroke="url(#cyanGrad)" stroke-width="1.8"/>
    <line x1="36" y1="36" x2="20" y2="26" stroke="url(#cyanGrad)" stroke-width="1.8"/>

    <!-- Orbiting Intelligence Nodes -->
    <circle cx="36" cy="16" r="3" fill="#38bdf8"/>
    <circle cx="52" cy="26" r="2.8" fill="#38bdf8"/>
    <circle cx="52" cy="46" r="2.8" fill="#38bdf8"/>
    <circle cx="36" cy="56" r="3" fill="#38bdf8"/>
    <circle cx="20" cy="46" r="2.8" fill="#38bdf8"/>
    <circle cx="20" cy="26" r="2.8" fill="#38bdf8"/>

    <!-- Central Core Nexus Node (Pulsing Focal Point) -->
    <circle cx="36" cy="36" r="5.5" fill="url(#electricGrad)" filter="url(#glow)"/>
    <circle cx="36" cy="36" r="2.2" fill="#ffffff"/>
  </g>

  <!-- ================= BRAND TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(98, 0)">
    <!-- Main Title: IntelNexus -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#f8fafc">Intel</tspan><tspan fill="url(#electricGrad)">Nexus</tspan>
    </text>

    <!-- Subtitle: PLATFORM / FUSION ENGINE -->
    <text x="2" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="4.8">
      PLATFORM <tspan fill="#0284c7" font-weight="800">·</tspan> OSINT FUSION HUB
    </text>

    <!-- Subtle Accent Line -->
    <line x1="2" y1="77" x2="340" y2="77" stroke="#1e293b" stroke-width="1"/>
    <line x1="2" y1="77" x2="72" y2="77" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
